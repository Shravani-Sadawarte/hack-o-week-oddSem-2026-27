project:
  name: VisualSeek
  version: "1.0.0"
  description: "AI-Powered Visual Similarity & Semantic Search Engine"
  dev_mode: true

dataset:
  name: stanford_dogs
  # path: null enables automatic discovery under parent directories
  path: null
  # limit: 1000 enables fast development mode; set to null for full 20,580 images
  limit: 1000
  seed: 42
  supported_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"

model:
  name: "ViT-B-32"
  pretrained: "openai"
  # device: auto, cpu, or cuda
  device: "auto"
  batch_size: 32
  image_size: 224

embedding:
  normalize: true
  dimension: 512

search:
  # engine: faiss or brute_force
  engine: "faiss"
  top_k: 10
  supported_k: [5, 10, 20, 50]
  metric: "cosine"

pca:
  n_components: 50
  random_state: 42

tsne:
  perplexity: 30
  max_iter: 1000
  random_state: 42
  early_exaggeration: 12.0

paths:
  artifacts_dir: "artifacts"
  embeddings_dir: "artifacts/embeddings"
  indexes_dir: "artifacts/indexes"
  reductions_dir: "artifacts/visualizations"
  metadata_dir: "artifacts/metadata"
  cache_dir: "artifacts/cache"
